<script>
/* ---------- 페이지 스텁 ---------- */
var LOG = [];
function rec(x){ LOG.push(x); return x; }
var store = {};
function lsGet(k){ return Object.prototype.hasOwnProperty.call(store,k) ? store[k] : null; }
function lsSet(k,v){ store[k]=String(v); }
function pad(n){ return (n<10?"0":"")+n; }
function toast(msg, label){ rec({t:"toast", msg:msg}); }
var helpOpened = 0;
function openHelp(){ helpOpened++; }
var signInCalls = [];
function cloudSignIn(silent){ signInCalls.push(!!silent); }
var S = { v:1, days:{ "2026-11-24":{ weight:"62.5" } }, ledger:{entries:[]}, contents:[], settings:{} };

var firebase = { auth:{ GoogleAuthProvider:{ credentialFromResult:function(){ return null; } } } };

/* 아주 작은 가짜 DOM */
var EL = {};
function fakeEl(sel){
  var e = {
    _sel: sel, hidden:false, textContent:"", innerHTML:"", title:"", dataset:{}, attrs:{},
    classes:{},
    classList:{ toggle:function(c,on){ if(on===undefined) on=!e.classes[c]; e.classes[c]=!!on; },
                add:function(c){ e.classes[c]=true; }, remove:function(c){ e.classes[c]=false; } },
    setAttribute:function(k,v){ e.attrs[k]=v; }
  };
  return e;
}

function resetEls(){ EL = {}; }

/* ============================================================
   10-3. Google Drive 자동 백업
   ------------------------------------------------------------
   · 같은 Google 로그인(Firebase GoogleAuthProvider)에
     drive.file 범위를 하나 더 붙여서, 이 앱이 만든 파일 하나만 다룹니다.
     (드라이브의 다른 파일은 읽지도 쓰지도 않습니다)
   · 플래너 상태(state 전체)를 room9rock-planner-backup.json 으로
     Google Drive에 자동 저장하고, 처음 만든 fileId로 계속 덮어씁니다.
   · 브라우저의 Google OAuth 토큰은 1시간 남짓이면 만료돼요.
     그때는 상단 배지가 'Drive 다시 연결'로 바뀝니다.
   · Drive API 사용 설정이 안 된 프로젝트에서는 403(accessNotConfigured)이
     오는데, 콘솔 오류로 터뜨리지 않고 'Drive 설정' 상태로 안내합니다.
   ============================================================ */
var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
var DRIVE_NAME = "room9rock-planner-backup.json";
var DRIVE_API = "https://www.googleapis.com/drive/v3/files";
var DRIVE_UP = "https://www.googleapis.com/upload/drive/v3/files";
var DRIVE_META_KEY = "bgs.workroom.drive.v1";
var DRIVE_TOK_KEY = "bgs.workroom.drive.token.v1";
var DRIVE_DEBOUNCE = 2500;      /* 저장이 멈추고 2.5초 뒤 백업 */
var DRIVE_MIN_GAP = 30000;      /* 자동 백업은 30초에 한 번까지만 */
var DRIVE_TIMEOUT = 20000;

var drive = {
  state:"off", user:false, token:"", exp:0, fileId:"", lastAt:0, webLink:"",
  timer:null, running:false, again:false
};

/* ---------- 파일 정보 · 토큰 보관 ---------- */
function driveLoadMeta(){
  try{
    var m=JSON.parse(lsGet(DRIVE_META_KEY)||"null");
    if(m){
      if(m.fileId) drive.fileId=m.fileId;
      if(m.lastAt) drive.lastAt=m.lastAt;
      if(m.webLink) drive.webLink=m.webLink;
    }
  }catch(e){}
}
function driveSaveMeta(){
  try{ lsSet(DRIVE_META_KEY, JSON.stringify({fileId:drive.fileId, lastAt:drive.lastAt, webLink:drive.webLink})); }catch(e){}
}
function driveTokenLoad(){
  try{
    var raw=sessionStorage.getItem(DRIVE_TOK_KEY);
    if(!raw) return false;
    var o=JSON.parse(raw);
    if(o && o.token && o.exp && o.exp>Date.now()){ drive.token=o.token; drive.exp=o.exp; return true; }
  }catch(e){}
  return false;
}
function driveTokenPut(token, exp){
  drive.token=token||""; drive.exp=exp||0;
  try{
    if(drive.token) sessionStorage.setItem(DRIVE_TOK_KEY, JSON.stringify({token:drive.token, exp:drive.exp}));
    else sessionStorage.removeItem(DRIVE_TOK_KEY);
  }catch(e){}
}
function driveTokenClear(){ driveTokenPut("",0); }

/* 로그인 결과에서 Google OAuth 액세스 토큰을 꺼냅니다 */
function driveCaptureToken(res){
  var tok="", secs=3600;
  try{
    var c=(res && res.credential) || null;
    if(!c && res && typeof firebase!=="undefined" && firebase.auth && firebase.auth.GoogleAuthProvider
      && firebase.auth.GoogleAuthProvider.credentialFromResult){
      c=firebase.auth.GoogleAuthProvider.credentialFromResult(res);
    }
    if(c && c.accessToken){ tok=c.accessToken; if(Number(c.expiresIn)>0) secs=Number(c.expiresIn); }
  }catch(e){}
  if(tok){
    var before=drive.state;
    driveTokenPut(tok, Date.now()+Math.max(300,(secs-90))*1000);
    driveSetState(drive.lastAt ? "ok" : "idle");
    if(before==="need" || before==="auth" || before==="off") toast("Google Drive 백업을 켰어요");
    if(!drive.lastAt || Date.now()-drive.lastAt>120000) driveSchedule(1200);
    return true;
  }
  if(cloud.user) driveSetState("need");
  return false;
}

/* 로그인 상태가 바뀔 때 */
function driveAfterSignIn(){
  driveLoadMeta();
  if(driveTokenLoad()){
    driveSetState(drive.lastAt ? "ok" : "idle");
    if(!drive.lastAt || Date.now()-drive.lastAt>300000) driveSchedule(1500);
    return;
  }
  driveSetState("need");
}
function driveOnSignOut(){
  clearTimeout(drive.timer); drive.timer=null;
  drive.running=false; drive.again=false;
  driveTokenClear();
  driveSetState("off");
}

/* ---------- 백업 예약 ---------- */
function driveSchedule(delay){
  if(!cloud.user || !drive.token) return;
  if(drive.state==="setup") return;
  var wait=Math.max(0, delay||0);
  var gap=DRIVE_MIN_GAP-(Date.now()-drive.lastAt);
  if(gap>wait) wait=gap;
  clearTimeout(drive.timer);
  drive.timer=setTimeout(function(){ drive.timer=null; driveBackup(false); }, wait);
}
function driveOnLocalChange(){
  if(!cloud.user || !drive.token) return;
  if(drive.state==="setup") return;
  driveSchedule(DRIVE_DEBOUNCE);
}

/* ---------- Drive REST (fetch) ---------- */
function driveFetch(url, opts){
  opts=opts||{};
  var headers=opts.headers||{};
  headers.Authorization="Bearer "+drive.token;
  opts.headers=headers;
  var timer=null;
  var timeout=new Promise(function(ok, no){ timer=setTimeout(function(){ no({status:0, text:"timeout"}); }, DRIVE_TIMEOUT); });
  return Promise.race([fetch(url, opts), timeout]).then(function(r){
    return r.text().then(function(txt){
      clearTimeout(timer);
      var body=null;
      try{ body=txt?JSON.parse(txt):null; }catch(e){ body=null; }
      if(r.ok) return body||{};
      var err=new Error("drive "+r.status);
      err.status=r.status; err.body=body; err.text=String(txt||"").slice(0,400);
      throw err;
    });
  }, function(e){
    clearTimeout(timer);
    if(e && e.status!==undefined) throw e;
    var err=new Error("drive network");
    err.status=0; err.text=String((e&&e.message)||e||"network");
    throw err;
  });
}

/* ---------- 파일 찾기 / 새로 만들기 ---------- */
function driveEnsureFile(){
  if(drive.fileId) return Promise.resolve(drive.fileId);
  var q=encodeURIComponent("name = '"+DRIVE_NAME+"' and trashed = false");
  var fields=encodeURIComponent("files(id,name,modifiedTime,webViewLink)");
  return driveFetch(DRIVE_API+"?q="+q+"&spaces=drive&pageSize=10&orderBy="+encodeURIComponent("modifiedTime desc")+"&fields="+fields, {method:"GET"})
    .then(function(d){
      var files=(d && d.files)||[];
      if(files.length){ drive.fileId=files[0].id; if(files[0].webViewLink) drive.webLink=files[0].webViewLink; driveSaveMeta(); return drive.fileId; }
      return driveCreateFile();
    });
}
function driveCreateFile(){
  var meta={
    name:DRIVE_NAME,
    mimeType:"application/json",
    description:"방구석 작업실 플래너 자동 백업"
  };
  var b="bgs"+Date.now()+Math.floor(Math.random()*1000);
  var body="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(meta)
         + "\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+drivePayload()
         + "\r\n--"+b+"--";
  return driveFetch(DRIVE_UP+"?uploadType=multipart&fields="+encodeURIComponent("id,name,webViewLink"), {
    method:"POST",
    headers:{"Content-Type":"multipart/related; boundary="+b},
    body:body
  }).then(function(d){
    if(!d || !d.id) throw {status:0, text:"no-id"};
    drive.fileId=d.id;
    if(d.webViewLink) drive.webLink=d.webViewLink;
    driveSaveMeta();
    return d.id;
  });
}
function drivePayload(){
  return JSON.stringify({
    app:"bgs-planner/1",
    kind:"room9rock-planner-backup",
    version:1,
    backupAt:new Date().toISOString(),
    clientId:(cloud && cloud.clientId)||"",
    state:S
  });
}

/* ---------- 백업 실행 ---------- */
function driveBackup(manual, retried){
  if(!cloud.user){ if(manual) toast("먼저 Google 로그인을 해 주세요."); return Promise.resolve(false); }
  if(drive.state==="setup"){
    if(manual){ toast("Google Cloud에서 Drive API를 켜야 해요."); openHelp(); renderDriveHelp(); }
    return Promise.resolve(false);
  }
  if(!drive.token){ driveSetState("need"); if(manual) driveConnect(); return Promise.resolve(false); }
  if(drive.running){ drive.again=true; return Promise.resolve(false); }
  var payload;
  try{ payload=drivePayload(); }
  catch(e){ driveSetState("error"); return Promise.resolve(false); }
  drive.running=true;
  driveSetState("busy");
  return driveEnsureFile().then(function(id){
    var fields=encodeURIComponent("id,modifiedTime,webViewLink");
    return driveFetch(DRIVE_UP+"/"+encodeURIComponent(id)+"?uploadType=media&fields="+fields,
      {method:"PATCH", headers:{"Content-Type":"application/json"}, body:payload});
  }).then(function(d){
    drive.running=false;
    drive.lastAt=Date.now();
    if(d && d.webViewLink) drive.webLink=d.webViewLink;
    driveSaveMeta();
    driveSetState("ok");
    if(manual) toast("Google Drive에 백업했어요 · "+clockText(drive.lastAt));
    if(drive.again){ drive.again=false; driveSchedule(900); }
    return true;
  }, function(err){
    drive.running=false;
    if(err && err.status===404 && !retried){
      drive.fileId=""; driveSaveMeta();          /* 파일이 지워졌으면 한 번만 다시 만듭니다 */
      return driveBackup(manual, true);
    }
    driveFail(err, manual);
    return false;
  });
}

/* ---------- 오류 분류 ---------- */
function driveFail(err, manual){
  var st=(err && err.status)||0;
  var reason="";
  try{ reason=(err.body && err.body.error && err.body.error.errors && err.body.error.errors[0] && err.body.error.errors[0].reason)||""; }catch(e){}
  var all=String(reason)+" "+String((err&&err.text)||"");
  if(st===401){
    driveTokenClear();
    driveSetState("auth");
    if(manual) toast("Drive 인증이 만료됐어요. 한 번만 다시 연결해 주세요.", "다시 연결", function(){ driveConnect(); });
    return;
  }
  if(st===403){
    if(/rateLimitExceeded|quotaExceeded|dailyLimitExceeded/i.test(reason)){
      driveSetState("error");
      if(manual) toast("Drive가 잠시 응답하지 않아요. 조금 뒤에 다시 해 보세요.");
      return;
    }
    if(/SERVICE_DISABLED|accessNotConfigured|has not been used|is disabled|not been enabled/i.test(all)){
      driveSetState("setup");
      if(manual){ toast("Google Cloud에서 Drive API를 켜야 해요."); openHelp(); renderDriveHelp(); }
      return;
    }
    driveTokenClear();
    driveSetState("need");
    if(manual) toast("Google Drive 권한을 다시 허용해 주세요.", "Drive 연결", function(){ driveConnect(); });
    return;
  }
  if(st===429 || st>=500){
    driveSetState("error");
    if(manual) toast("Drive가 잠시 응답하지 않아요. 조금 뒤에 다시 해 보세요.");
    return;
  }
  driveSetState("error");
  if(manual) toast("Drive 백업을 마치지 못했어요. 기록은 기기와 클라우드에 그대로 있어요.");
}

/* ---------- 연결 / 버튼 동작 ---------- */
function driveConnect(){
  if(location.protocol==="file:"){ toast("배포된 주소에서 열면 Drive 백업을 쓸 수 있어요."); return; }
  if(!cloud.auth){ toast("동기화 기능을 불러오지 못했어요. 인터넷 연결을 확인해 주세요."); return; }
  cloudSignIn(drive.state!=="need");   /* 권한이 없을 때는 계정 선택 창을 띄웁니다 */
}
function driveChipClick(){
  if(!cloud.user){ cloudSignIn(); return; }
  if(drive.state==="need" || drive.state==="auth"){ driveConnect(); return; }
  if(drive.state==="setup"){ openHelp(); renderDriveHelp(); toast("Google Cloud 콘솔에서 Drive API를 ‘사용’으로 켜 주세요."); return; }
  if(drive.state==="busy"){ toast("지금 Drive에 저장하고 있어요."); return; }
  driveBackup(true);
}

/* ---------- 상태 표시 ---------- */
function clockText(ts){ var d=new Date(ts); return pad(d.getHours())+":"+pad(d.getMinutes()); }
function driveLabel(){
  var m={off:"Drive 백업", need:"Drive 연결", idle:"Drive 백업", busy:"Drive 저장 중…",
         ok:"Drive 백업됨", auth:"Drive 다시 연결", setup:"Drive 설정", error:"Drive 오류"};
  return m[drive.state]||"Drive 백업";
}
function driveSetState(st){
  drive.state=st||"off";
  driveUI();
  renderDriveHelp();
}
function driveUI(){
  var b=$("#driveStat"), t=$("#driveStatText");
  if(!b) return;
  var show=!!cloud.user && drive.state!=="off";
  b.hidden=!show;
  if(!show) return;
  if(t) t.textContent=driveLabel();
  b.classList.toggle("busy", drive.state==="busy");
  b.classList.toggle("wait", drive.state==="need");
  b.classList.toggle("bad", drive.state==="auth" || drive.state==="setup" || drive.state==="error");
  var tip={
    ok:"플래너 기록이 Google Drive에 자동 백업되고 있어요."+(drive.lastAt?" 마지막 "+clockText(drive.lastAt):"")+" · 눌러서 지금 백업",
    idle:"Google Drive 자동 백업 대기 중이에요. 눌러서 지금 백업",
    busy:"Google Drive에 저장하는 중이에요.",
    need:"Google Drive 백업 권한을 한 번만 허용해 주세요. 눌러서 연결",
    auth:"Google 인증이 만료됐어요. 눌러서 다시 연결하면 백업이 이어져요.",
    setup:"Google Cloud에서 Drive API를 켜야 해요. 눌러서 안내 보기",
    error:"Drive 백업이 잠시 멈췄어요. 눌러서 다시 시도"
  }[drive.state]||"Google Drive 자동 백업";
  b.title=tip;
  b.setAttribute("aria-label", driveLabel()+" — "+tip);
}
function renderDriveHelp(){
  var st=$("#driveHelpState");
  if(!st) return;
  var ti=$("#driveHelpTime"), now=$("#driveNowBtn"), re=$("#driveReauthBtn"), op=$("#driveOpenBtn"), note=$("#driveNote");
  var labels={
    off:"Drive 백업 꺼짐 — Google 로그인하면 함께 켜져요",
    need:"Drive 권한이 필요해요",
    idle:"자동 백업 준비됨",
    busy:"Drive에 저장하는 중…",
    ok:"자동 백업 중",
    auth:"Drive 인증이 만료됐어요",
    setup:"Drive API를 켜야 해요",
    error:"Drive 백업이 잠시 멈췄어요"
  };
  st.textContent=labels[drive.state]||"Drive 백업";
  if(ti){
    if(drive.lastAt){ var d=new Date(drive.lastAt); ti.textContent="마지막 백업 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+clockText(drive.lastAt); }
    else ti.textContent="";
  }
  if(now) now.hidden=!(drive.token && drive.state!=="need" && drive.state!=="auth" && drive.state!=="setup" && drive.state!=="off");
  if(re){ re.hidden=!(cloud.user && (drive.state==="need" || drive.state==="auth" || drive.state==="off")); re.textContent=(drive.state==="need")?"Drive 연결":"Drive 다시 연결"; }
  if(op){
    var id=drive.fileId;
    op.hidden=!id;
    if(id) op.dataset.url="https://drive.google.com/file/d/"+id+"/view";
  }
  if(note){
    var extra="";
    if(drive.state==="setup") extra="Google Cloud 콘솔 → API 라이브러리에서 <b>Google Drive API</b>를 ‘사용’으로 켜면 바로 동작해요. (프로젝트: room9rock-planner)";
    else if(drive.state==="auth") extra="Google 인증은 1시간쯤 지나면 만료돼요. <b>Drive 다시 연결</b>을 한 번 누르면 이어서 백업해요.";
    else if(drive.state==="need") extra="로그인할 때 나오는 <b>Google Drive 파일 보기·관리</b> 권한을 허용하면 자동 백업이 시작돼요.";
    else if(drive.state==="ok") extra="적을 때마다 30초에 한 번씩 자동으로 덮어써요. 알림이 올 때까지 그대로 두면 돼요.";
    note.innerHTML=extra;
    note.hidden=!extra;
  }
}

/* ---------- 시작 ---------- */
function driveBoot(){
  driveLoadMeta();
  driveTokenLoad();
  driveSetState("off");
}



/* ---------- 테스트 도구 ---------- */
var results = [];
function ok(name, cond, detail){ results.push((cond?"PASS":"FAIL")+"  "+name+(detail?"  — "+detail:"")); }
function eq(name, a, b){ ok(name, JSON.stringify(a)===JSON.stringify(b), "got "+JSON.stringify(a)+" want "+JSON.stringify(b)); }

function resp(status, obj){
  var txt = obj===undefined ? "" : JSON.stringify(obj);
  return { ok: status>=200 && status<300, status: status, text: function(){ return Promise.resolve(txt); } };
}
var calls = [];
function stubFetch(handler){
  calls = [];
  window.fetch = function(url, opts){
    var c = { url:String(url), method:(opts&&opts.method)||"GET", headers:(opts&&opts.headers)||{}, body:(opts&&opts.body)||"" };
    calls.push(c);
    return Promise.resolve().then(function(){ return handler(c); });
  };
}
function resetDrive(){
  drive.state="off"; drive.token=""; drive.exp=0; drive.fileId=""; drive.lastAt=0;
  drive.webLink=""; drive.running=false; drive.again=false;
  if(drive.timer){ clearTimeout(drive.timer); drive.timer=null; }
  store = {}; resetEls(); LOG = []; signInCalls = []; helpOpened = 0;
  try{ sessionStorage.clear(); }catch(e){}
}
function signedIn(token){
  cloud.user = { uid:"u1" };
  driveTokenPut(token||"tok", Date.now()+3600*1000);
}

(async function run(){
  var out = [];

  /* T1 새 파일 만들기 */
  resetDrive(); signedIn();
  stubFetch(function(c){
    if(c.method==="GET") return resp(200, {files:[]});
    if(c.method==="POST") return resp(200, {id:"F1", name:"room9rock-planner-backup.json", webViewLink:"https://drive.google.com/file/d/F1/view"});
    return resp(500, {error:{message:"unexpected"}});
  });
  var r1 = await driveBackup(true);
  var post = calls.filter(function(c){ return c.method==="POST"; })[0];
  ok("T1 새 파일 백업 성공", r1===true, "state="+drive.state);
  ok("T1 POST multipart 업로드", !!post && /uploadType=multipart/.test(post.url), post && post.url);
  ok("T1 multipart 본문에 백업 JSON", !!post && /room9rock-planner-backup/.test(post.body) && /multipart\/related; boundary=/.test(post.headers["Content-Type"]||""), post && post.headers["Content-Type"]);
  ok("T1 Authorization 헤더", !!post && post.headers.Authorization==="Bearer tok", post && post.headers.Authorization);
  eq("T1 fileId 저장", drive.fileId, "F1");
  ok("T1 파일 정보 localStorage", /F1/.test(lsGet(DRIVE_META_KEY)||""), lsGet(DRIVE_META_KEY));
  eq("T1 상태", drive.state, "ok");

  /* T2 같은 파일 덮어쓰기 */
  resetDrive(); signedIn(); drive.fileId="F1"; drive.lastAt=Date.now()-60000;
  stubFetch(function(c){ if(c.method==="PATCH") return resp(200, {id:"F1", webViewLink:"https://drive.google.com/file/d/F1/view"}); return resp(500,{}); });
  var r2 = await driveBackup(false);
  ok("T2 기존 파일 덮어쓰기", r2===true && drive.state==="ok");
  eq("T2 요청 수(목록 조회 없음)", calls.length, 1);
  ok("T2 PATCH 주소", /\/files\/F1\?uploadType=media/.test(calls[0].url), calls[0].url);

  /* T3 드라이브에 이미 있는 파일 이어받기 */
  resetDrive(); signedIn();
  stubFetch(function(c){
    if(c.method==="GET") return resp(200, {files:[{id:"F9", name:"room9rock-planner-backup.json", webViewLink:"https://drive.google.com/file/d/F9/view"}]});
    if(c.method==="PATCH") return resp(200, {id:"F9"});
    return resp(500,{});
  });
  var r3 = await driveBackup(false);
  eq("T3 기존 파일 채택", [r3, drive.fileId, calls.length], [true,"F9",2]);

  /* T4 401 → 인증 만료 */
  resetDrive(); signedIn();
  stubFetch(function(){ return resp(401, {error:{code:401, message:"Invalid Credentials", errors:[{reason:"authError"}]}}); });
  var r4 = await driveBackup(true);
  eq("T4 401 상태", [r4, drive.state, drive.token], [false,"auth",""]);
  ok("T4 401 세션 토큰 삭제", !sessionStorage.getItem(DRIVE_TOK_KEY));

  /* T5 403 Drive API 미사용 설정 */
  resetDrive(); signedIn();
  stubFetch(function(){ return resp(403, {error:{code:403, message:"Google Drive API has not been used in project 634990322785 before or it is disabled.", errors:[{reason:"accessNotConfigured"}]}}); });
  var r5 = await driveBackup(true);
  eq("T5 403 설정 필요 상태", [r5, drive.state], [false,"setup"]);
  ok("T5 403은 도움말 안내", helpOpened>0, "openHelp="+helpOpened);
  ok("T5 403은 토큰 유지", !!drive.token);

  /* T6 403 권한 부족 */
  resetDrive(); signedIn();
  stubFetch(function(){ return resp(403, {error:{code:403, message:"Request had insufficient authentication scopes.", errors:[{reason:"insufficientPermissions"}]}}); });
  var r6 = await driveBackup(false);
  eq("T6 403 권한 상태", [r6, drive.state, drive.token], [false,"need",""]);

  /* T7 404면 다시 만들기 */
  resetDrive(); signedIn(); drive.fileId="GONE"; drive.lastAt=Date.now()-60000;
  var n = 0;
  stubFetch(function(c){
    if(c.method==="PATCH") return resp(404, {error:{code:404, message:"File not found"}});
    if(c.method==="GET") return resp(200, {files:[]});
    if(c.method==="POST") return resp(200, {id:"F2"});
    return resp(500,{});
  });
  var r7 = await driveBackup(false);
  eq("T7 404 후 재생성", [r7, drive.fileId, drive.state], [true,"F2","ok"]);
  eq("T7 요청 순서", calls.map(function(c){return c.method;}), ["PATCH","GET","POST"]);

  /* T8 네트워크 오류 */
  resetDrive(); signedIn();
  window.fetch = function(){ return Promise.reject(new TypeError("Failed to fetch")); };
  var r8 = await driveBackup(true);
  eq("T8 네트워크 오류 상태", [r8, drive.state], [false,"error"]);

  /* T9 예약(디바운스·최소 간격) */
  resetDrive(); signedIn(); drive.lastAt=0;
  var realTimeout = window.setTimeout, delays = [];
  window.setTimeout = function(fn, ms){ delays.push(ms); return 1; };
  driveSchedule(DRIVE_DEBOUNCE);
  window.setTimeout = realTimeout;
  eq("T9 첫 예약은 디바운스", delays, [2500]);
  delays = [];
  drive.lastAt = Date.now() - 5000;
  window.setTimeout = function(fn, ms){ delays.push(ms); return 1; };
  driveSchedule(DRIVE_DEBOUNCE);
  window.setTimeout = realTimeout;
  ok("T9 최소 30초 간격", delays.length===1 && delays[0] > 20000, "delay="+delays[0]);
  delays = []; drive.state="setup"; drive.lastAt=0;
  window.setTimeout = function(fn, ms){ delays.push(ms); return 1; };
  driveSchedule(DRIVE_DEBOUNCE);
  window.setTimeout = realTimeout;
  eq("T9 설정 문제 상태에서는 예약 안 함", delays.length, 0);

  /* T10 로그인 결과에서 토큰 받기 (credentials 방식) */
  resetDrive();
  driveCaptureToken({ credential:{ accessToken:"tok2" } });
  ok("T10 토큰 보관", drive.token==="tok2" && !!sessionStorage.getItem(DRIVE_TOK_KEY), JSON.stringify(sessionStorage.getItem(DRIVE_TOK_KEY)));
  ok("T10 미로그인 상태에서는 배지 숨김", EL["#driveStat"].hidden===true);

  /* T11 credentialFromResult 폴백 */
  resetDrive();
  firebase.auth.GoogleAuthProvider.credentialFromResult = function(){ return { accessToken:"tok3" }; };
  driveCaptureToken({ user:{uid:"u1"} });
  ok("T11 credentialFromResult 폴백", drive.token==="tok3", drive.token);

  /* T12 백업 JSON 구조 */
  resetDrive();
  var p = JSON.parse(drivePayload());
  eq("T12 JSON 키", Object.keys(p), ["app","kind","version","backupAt","clientId","state"]);
  ok("T12 state 전체 포함", p.state && p.state.days && p.state.days["2026-11-24"] && p.state.days["2026-11-24"].weight==="62.5");
  ok("T12 clientId 포함", p.clientId==="ctest", p.clientId);

  /* T13 로그아웃/로그인 상태 전환 */
  resetDrive(); signedIn(); driveSetState("ok");
  cloud.user=null; driveOnSignOut();
  eq("T13 로그아웃 상태", [drive.state, drive.token], ["off",""]);
  cloud.user={uid:"u1"};
  driveAfterSignIn();
  eq("T13 토큰 없으면 연결 필요", drive.state, "need");

  /* T14 권한 없으면 로그인 요청 */
  resetDrive(); cloud.user={uid:"u1"}; driveSetState("need");
  await driveBackup(true);
  eq("T14 권한 없으면 재로그인", signInCalls, [false]);
  resetDrive(); cloud.user={uid:"u1"}; driveSetState("auth");
  driveChipClick();
  eq("T14 만료면 조용한 재로그인", signInCalls, [true]);

  /* T15 상태 배지 문구 */
  resetDrive(); cloud.user={uid:"u1"}; driveSetState("ok");
  eq("T15 배지 표시", [EL["#driveStat"].hidden, EL["#driveStat"].classes.bad, EL["#driveStatText"].textContent], [false, false, "Drive 백업됨"]);
  driveSetState("setup");
  ok("T15 설정 상태 배지", EL["#driveStat"].classes.bad===true && EL["#driveStatText"].textContent==="Drive 설정");
  cloud.user=null; driveSetState("off");
  eq("T15 로그아웃 시 숨김", EL["#driveStat"].hidden, true);

  /* 결과 출력 */
  var pass = results.filter(function(x){return x.indexOf("PASS")===0;}).length;
  var head = pass+"/"+results.length+" passed (module sha b98de877d479)";
  document.getElementById("out").textContent = head+"\n\n"+results.join("\n");
  document.title = pass+"/"+results.length+" drive-selftest";
  window.__results = results;
})().catch(function(e){
  document.getElementById("out").textContent = "HARNESS ERROR: "+(e&&e.stack||e);
  document.title = "harness-error";
});
</script>
</body></html>
