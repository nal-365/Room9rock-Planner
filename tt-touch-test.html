<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>타임테이블 터치·되돌리기 자동 점검</title>
<style>body{font:13px/1.6 -apple-system,system-ui,sans-serif;padding:16px;background:#F7F2EE;color:#2F3B57}
h1{font-size:15px}.ok{color:#2F7F60;font-weight:800}.ng{color:#AE4A45;font-weight:800}
td{padding:3px 10px;border-bottom:1px solid #E7E0D2;vertical-align:top}code{font-size:11.5px}
iframe{width:1280px;height:900px;border:1px solid #D8CFC0;position:absolute;left:-9999px;top:0}</style></head>
<body>
<h1>임시 점검 페이지 — 타임테이블 터치(0.18초 꾹) · ↺ 되돌리기</h1>
<table id="out"><tr><td>실행 중…</td></tr></table>
<iframe id="fr" src="./index.html"></iframe>
<script>
var results=[];
function add(name, pass, detail){ results.push({name:name, pass:pass, detail:String(detail)}); render(); }
function render(){
  document.getElementById('out').innerHTML=results.map(function(r){
    return '<tr><td>'+(r.pass?'<span class="ok">PASS</span>':'<span class="ng">FAIL</span>')+'</td><td>'+r.name+'</td><td><code>'+r.detail.replace(/</g,'&lt;')+'</code></td></tr>';
  }).join('') || '<tr><td>실행 중…</td></tr>';
  document.title=(results.filter(function(r){return r.pass;}).length)+'/'+results.length+' PASS · TT touch & undo';
}
function sleep(ms){ return new Promise(function(r){ setTimeout(r,ms); }); }
function W(){ return document.getElementById('fr').contentWindow; }
function D(){ return document.getElementById('fr').contentDocument; }

function waitFor(sel, ms){
  return new Promise(function(res){
    var t=0, iv=setInterval(function(){
      t+=100;
      var d=D();
      if(d && d.querySelector(sel)){ clearInterval(iv); res(true); }
      else if(t>ms){ clearInterval(iv); res(false); }
    },100);
  });
}
function run(){
  return waitFor('#undoBtn', 20000).then(async function(found){
    if(!found){ add('앱 로드', false, 'index.html iframe에서 #undoBtn을 찾지 못함'); return; }
    await sleep(400);
    var d=D();
    var g=d.querySelector('#dailyTT .tt-grid');
    var undoBtn=d.querySelector('#undoBtn');
    var box=function(){ return g.querySelector('.tt-cells').getBoundingClientRect(); };
    var pt=function(row,col){ var c=box(); return {x:c.x+c.width/6*(col+0.5), y:c.y+c.height/24*(row+0.5)}; };
    var send=function(type,x,y,kind,id){
      g.dispatchEvent(new PointerEvent(type,{pointerId:id||71,pointerType:kind||'touch',clientX:x,clientY:y,
        bubbles:true,cancelable:true,isPrimary:true,button:0,buttons:(type==='pointerup'?0:1)}));
    };
    var painted=function(){ return g.querySelectorAll('.tt-cell.on').length; };
    var undoDis=function(){ return d.querySelector('#undoBtn').disabled; };
    var start=painted();

    add('시작 상태(오늘 칠한 칸)', true, 'date='+g.dataset.date+' painted='+start+' undoDisabled='+undoDis());

    add('되돌리기 버튼이 도구줄 오른쪽 끝',
        (function(){ var b=undoBtn.getBoundingClientRect(), t=d.querySelector('.board-tools').getBoundingClientRect();
                     return b.width>0 && Math.abs(t.right-b.right)<18 && b.left>t.left+t.width*0.55; })(),
        (function(){ var b=undoBtn.getBoundingClientRect(), t=d.querySelector('.board-tools').getBoundingClientRect();
                     return 'btn.right='+b.right.toFixed(1)+' tools.right='+t.right.toFixed(1)+' btnW='+b.width.toFixed(1); })());
    add('팔레트 칩만 가로로 스크롤',
        (function(){ var p=d.querySelector('.pal-scroll'); return getComputedStyle(p).overflowX==='auto' && p.contains(d.querySelector('#paletteItems')) && getComputedStyle(d.querySelector('.board-tools')).overflowX==='hidden'; })(),
        (function(){ var p=d.querySelector('.pal-scroll'); return 'palScroll='+getComputedStyle(p).overflowX+' tools='+getComputedStyle(d.querySelector('.board-tools')).overflowX+' scrollW='+p.scrollWidth+' clientW='+p.clientWidth; })());

    // 1) 터치 짧은 탭 → 무시
    var p=pt(9,1); send('pointerdown',p.x,p.y); await sleep(60); send('pointerup',p.x,p.y); await sleep(120);
    add('터치 짧은 탭(60ms)은 칠하지 않음', painted()===start && undoDis(), 'painted='+painted()+' undoDisabled='+undoDis());

    // 2) 누른 뒤 곧장 8px 이상 이동 → 스크롤로 보고 무시
    p=pt(10,1); send('pointerdown',p.x,p.y); await sleep(40);
    send('pointermove',p.x+3,p.y+22); send('pointermove',p.x+3,p.y+44); await sleep(260); send('pointerup',p.x+3,p.y+44); await sleep(120);
    add('터치 이동(스크롤)은 칠하지 않음', painted()===start && undoDis(), 'painted='+painted()+' undoDisabled='+undoDis());

    // 3) 0.18초 꾹 누르면 칠하기 시작
    p=pt(11,0); send('pointerdown',p.x,p.y); await sleep(240);
    add('0.18초 꾹 누르면 칠하기 시작', painted()===start+1 && g.classList.contains('painting') && !undoDis(),
        'painted='+painted()+' painting='+g.classList.contains('painting')+' undoDisabled='+undoDis());

    // 4) 꾹 누른 채 끌기 → 범위 칠하기
    var c=box(); send('pointermove',p.x+c.width/6*2,p.y+2); await sleep(80);
    add('꾹 누른 채 끌면 범위가 칠해짐', painted()===start+3, 'painted='+painted());
    send('pointerup',p.x+c.width/6*2,p.y+2); await sleep(80);
    add('손을 떼면 칠하기 종료', !g.classList.contains('painting'), 'painting='+g.classList.contains('painting'));

    // 5) 되돌리기 버튼
    add('칠한 뒤 되돌리기 버튼 활성', !undoDis(), 'undoDisabled='+undoDis());
    undoBtn.click(); await sleep(200);
    add('되돌리기 누르면 원래대로', painted()===start && undoDis(), 'painted='+painted()+' undoDisabled='+undoDis());

    // 6) 마우스는 지연 없이 즉시
    var m=pt(14,2);
    send('pointerdown',m.x,m.y,'mouse',72); await sleep(5);
    var mouseNow=painted();
    send('pointerup',m.x,m.y,'mouse',72); await sleep(120);
    add('마우스는 즉시 칠하기', mouseNow===start+1, 'painted(5ms 뒤)='+mouseNow);
    d.querySelector('#undoBtn').click(); await sleep(200);

    // 7) 주간 미니 시간표
    d.querySelector('.tab[data-view="week"]').click(); await sleep(400);
    d.querySelector('#weekIndex [data-wtab="time"]').click(); await sleep(400);
    var wg=d.querySelector('#weekTime .tt-grid');
    var wUndo=d.querySelector('#undoBtnWeek');
    if(!wg || !wUndo){ add('주간 미니 시간표 로드', false, 'week grid/undo 없음'); }
    else {
      var wbox=function(){ return wg.querySelector('.tt-cells').getBoundingClientRect(); };
      var wpt=function(row,col){ var b=wbox(); return {x:b.x+b.width/6*(col+0.5), y:b.y+b.height/24*(row+0.5)}; };
      var wsend=function(type,x,y){ wg.dispatchEvent(new PointerEvent(type,{pointerId:81,pointerType:'touch',clientX:x,clientY:y,
        bubbles:true,cancelable:true,isPrimary:true,button:0,buttons:(type==='pointerup'?0:1)})); };
      var wpainted=function(){ return wg.querySelectorAll('.tt-cell.on').length; };
      var wstart=wpainted();
      var q=wpt(8,3);
      wsend('pointerdown',q.x,q.y); await sleep(60); wsend('pointerup',q.x,q.y); await sleep(140);
      var tap=wpainted();
      wsend('pointerdown',q.x,q.y); await sleep(240);
      var hold=wpainted();
      wsend('pointerup',q.x,q.y); await sleep(120);
      add('주간 미니: 짧은 탭 무시 · 꾹 누르면 칠하기', tap===wstart && hold===wstart+1 && !wUndo.disabled,
          'date='+wg.dataset.date+' tap='+tap+' hold='+hold+' weekUndoDisabled='+wUndo.disabled);
      var wb=wUndo.getBoundingClientRect(), wt=wUndo.parentElement.getBoundingClientRect();
      add('주간 되돌리기 버튼이 도구줄 오른쪽 끝', wb.width>0 && Math.abs(wt.right-wb.right)<18,
          'btn.right='+wb.right.toFixed(1)+' tools.right='+wt.right.toFixed(1));
      wUndo.click(); await sleep(200);
      add('주간 되돌리기 동작', wpainted()===wstart && wUndo.disabled, 'painted='+wpainted()+' undoDisabled='+wUndo.disabled);
    }

    // 8) 좁은 화면(아이패드 세로 768 / 폰 390)에서 팔레트 스크롤·되돌리기 고정
    var frEl=document.getElementById('fr');
    var widths=[768,390];
    for(var wi=0; wi<widths.length; wi++){
      frEl.style.width=widths[wi]+'px'; await sleep(500);
      var sc=d.querySelector('.pal-scroll'), tb=d.querySelector('.board-tools'), ub=d.querySelector('#undoBtn');
      var before=ub.getBoundingClientRect();
      sc.scrollLeft=220; await sleep(150);
      var after=ub.getBoundingClientRect();
      add(widths[wi]+'px: 팔레트는 옆으로 밀리고 되돌리기 버튼은 제자리',
          sc.scrollWidth>sc.clientWidth+20 && Math.abs(before.left-after.left)<1 && after.right<=tb.getBoundingClientRect().right+1 && after.width>0,
          'scrollW='+sc.scrollWidth+' clientW='+sc.clientWidth+' scrollLeft='+sc.scrollLeft+' btnLeft '+before.left.toFixed(1)+'→'+after.left.toFixed(1)+' btnRight='+after.right.toFixed(1)+' toolsRight='+tb.getBoundingClientRect().right.toFixed(1));
      sc.scrollLeft=0;
    }
    frEl.style.width='1280px'; await sleep(400);

    // 9) 점검이 남긴 것이 없는지
    d.querySelector('.tab[data-view="daily"]').click(); await sleep(300);
    var g2=d.querySelector('#dailyTT .tt-grid');
    add('점검 뒤 오늘 칠한 칸이 처음과 같음', g2.querySelectorAll('.tt-cell.on').length===start,
        'painted='+g2.querySelectorAll('.tt-cell.on').length+' (시작 '+start+')');
  }).catch(function(e){ add('스크립트 오류', false, e && e.message || e); });
}
setTimeout(function(){ run(); }, 150);
</script>
</body></html>
